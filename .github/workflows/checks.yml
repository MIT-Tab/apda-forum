name: Forum checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    # Playwright 1.58.2 supports Ubuntu 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm run lint
      - run: npm run test:workflow
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          FORUM_BROWSER_TESTS: 1
  mariadb-migration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: local-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - run: python3 tests/mariadb-migration.py
        env:
          MYSQL_TEST_COMMAND: mariadb -h 127.0.0.1 -P 3306 -u root
          MYSQL_PWD: local-test-only
  deployment-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests/deploy -v
      - run: python3 -m py_compile scripts/deploy/server.py scripts/deploy/build-release.py
  package:
    needs: [checks, mariadb-migration, deployment-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: build
        run: python3 scripts/deploy/build-release.py "$RUNNER_TEMP/forum-release"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forum-${{ github.sha }}
          path: ${{ runner.temp }}/forum-release/
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: package
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://apda.online/forum/
    concurrency:
      group: apda-forum-production
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/forum-release
          merge-multiple: true
      - name: Deploy the tested artifact through the restricted SSH command
        env:
          DEPLOY_KEY: ${{ secrets.APDA_FORUM_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.APDA_FORUM_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.APDA_FORUM_KNOWN_HOSTS }}
          ARTIFACT_DIGEST: ${{ needs.package.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/apda-ci-key"
          hosts="$RUNNER_TEMP/apda-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          archive="$RUNNER_TEMP/forum-release/asgaros-forum.zip"
          printf '%s  %s\n' "$ARTIFACT_DIGEST" "$archive" | sha256sum --check
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA $ARTIFACT_DIGEST" < "$archive"
          printf 'Deployed commit `%s` to https://apda.online/forum/\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
